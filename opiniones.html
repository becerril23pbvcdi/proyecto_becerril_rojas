<!-- opiniones.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiniones - Física V</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- Mismo menú -->
    
    <main class="container mt-5 pt-5">
        <h1 class="display-4 mb-4 titulo-sombra text-center">Opiniones y Comentarios</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="caja-texto animacion-entrada">
                    <h2 class="titulo-sombra">Comparte tu opinión</h2>
                    <p>Tu feedback es importante para mejorar este sitio educativo. Comparte tus comentarios, sugerencias o dudas sobre los temas de física.</p>
                    
                    <form action="guardar_opinion.php" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="opinion" class="form-label">Tu Opinión</label>
                            <textarea class="form-control" id="opinion" name="opinion" 
                                      rows="6" required 
                                      placeholder="Escribe aquí tu comentario, sugerencia o pregunta..."></textarea>
                            <div class="form-text">Máximo 1000 caracteres.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="tema" class="form-label">Tema relacionado (opcional)</label>
                            <select class="form-select" id="tema" name="tema">
                                <option value="">Selecciona un tema</option>
                                <option value="leyes_newton">Leyes de Newton</option>
                                <option value="fuerzas_fundamentales">Fuerzas Fundamentales</option>
                                <option value="equilibrio">Equilibrio y Torque</option>
                                <option value="movimiento_circular">Movimiento Circular</option>
                                <option value="general">General del sitio</option>
                            </select>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="permitir_contacto" name="permitir_contacto">
                            <label class="form-check-label" for="permitir_contacto">
                                Permito que me contacten para seguir la conversación
                            </label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Enviar Opinión</button>
                            <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
                        </div>
                    </form>
                </div>
                
                <div class="caja-texto mt-4">
                    <h3 class="titulo-sombra">Opiniones Recientes</h3>
                    <div id="opiniones-container">
                        <p class="text-center text-muted">Las opiniones aparecerán aquí después de ser enviadas.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Botón y footer -->
</body>
</html>
